<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Site</title>
  <style>
    :root { --bg: #fafaf9; --fg: #1c1917; --muted: #78716c; --accent: #2563eb; }
    @media (prefers-color-scheme: dark) {
      :root { --bg: #1c1917; --fg: #f5f5f4; --muted: #a8a29e; --accent: #60a5fa; }
    }
    body { margin: 0; background: var(--bg); color: var(--fg);
      font: 18px/1.6 system-ui, -apple-system, sans-serif; }
    main { max-width: 640px; margin: 0 auto; padding: 64px 16px; }
    h1 { font-size: 2.2rem; margin: 0 0 8px; }
    p { color: var(--muted); }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>Hello 👋</h1>
    <p>This site is live. Content coming soon.</p>
  </main>
</body>
</html>
